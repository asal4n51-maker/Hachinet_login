<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hachinet - Lampu Aladin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0a0a0a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;transition:background .6s;overflow-x:hidden}
body.lamp-on{background:#2a1a00}

/* === LAMPU ALADIN === */
.lamp-area{position:relative;width:100%;max-width:400px;height:360px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
.magic-glow{position:absolute;bottom:60px;left:50%;transform:translateX(-50%);width:0;height:0;border-radius:50%;transition:all .6s;z-index:0}
body.lamp-on .magic-glow{width:320px;height:320px;background:radial-gradient(circle, rgba(255,215,0,.45), rgba(255,150,0,.15) 50%, transparent 70%);box-shadow:0 0 80px 40px rgba(255,200,0,.4)}

/* KENDI ALADIN - pake emoji gede biar mirip */
#genieLamp{
  position:relative;z-index:2;font-size:150px;line-height:1;cursor:pointer;
  transition:all .5s;user-select:none;-webkit-tap-highlight-color:transparent;
  filter:grayscale(1) brightness(.6);opacity:.55;transform:scale(.95);
}
#genieLamp.on{
  filter:none;opacity:1;transform:scale(1.05) rotate(-2deg);
  filter:drop-shadow(0 0 30px gold) drop-shadow(0 0 60px orange);
  animation:shake .4s;
}
@keyframes shake{0%,100%{transform:scale(1.05) rotate(-2deg)}25%{transform:scale(1.08) rotate(2deg)}50%{transform:scale(1.05) rotate(-3deg)}75%{transform:scale(1.08) rotate(3deg)}}

/* ASAP JIN */
#smoke{position:absolute;bottom:190px;left:50%;transform:translateX(-50%);font-size:70px;opacity:0;transition:opacity .6s;z-index:3;pointer-events:none}
#smoke.show{opacity:1;animation:float 2s infinite}
@keyframes float{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-15px)}}
#genie{position:absolute;bottom:210px;left:50%;transform:translateX(-50%) scale(0);font-size:90px;transition:transform .6s cubic-bezier(.34,1.56,.64,1);z-index:4;pointer-events:none}
#genie.show{transform:translateX(-50%) scale(1)}

#status{margin-top:10px;font-size:14px;color:#aaa;text-align:center;line-height:1.6;z-index:2}
#rubBtn{margin-top:12px;padding:12px 25px;background:linear-gradient(45deg,#FFD700,#FF9800);color:#000;border:0;border-radius:25px;font-weight:bold;font-size:15px;cursor:pointer;box-shadow:0 5px 20px rgba(255,180,0,.4)}
#rubBtn:active{transform:scale(.95)}

/* LOGIN */
.card{background:#1a1a1a;padding:25px;border-radius:20px;width:90%;max-width:350px;text-align:center;margin-top:25px;z-index:2}
h1{margin-bottom:15px;font-size:20px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;outline:none}
button.loginBtn{width:100%;padding:12px;background:#ff2e7e;color:#fff;border:0;border-radius:10px;font-size:16px;margin-top:10px;cursor:pointer}
#error{color:#ff5555;font-size:13px;margin-top:8px;display:none}
#appInside{display:none;margin-top:15px;color:#4dff88}
.hint{font-size:12px;color:#777;margin-top:10px}
</style>
</head>
<body id="body">

<!-- LAMPU ALADIN -->
<div class="lamp-area">
  <div class="magic-glow"></div>
  <div id="genie">🧞‍♂️</div>
  <div id="smoke">💨✨</div>
  <div id="genieLamp">🪔</div>
  <div id="status">Kendi Mati - Redup Kusam<br>👇 Gosok Lampunya Biar Jin Keluar!</div>
  <button id="rubBtn" onclick="toggleLamp()">✨ GOSOK LAMPU ✨</button>
</div>

<!-- LOGIN -->
<div class="card">
  <h1>🔐 HACHINET LOGIN</h1>
  <input type="text" id="username" placeholder="Username" autocomplete="off">
  <input type="password" id="password" placeholder="Password">
  <button class="loginBtn" onclick="doLogin()">MASUK</button>
  <div id="error">Username / Password salah!</div>
  <p class="hint">User: admin | Pass: admin</p>
  <div id="appInside">✅ Berhasil Masuk! Selamat datang Admin.</div>
</div>

<div id="yt-player" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"></div>

<script>
function doLogin(){
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value.trim();
  if(u==='admin'&&p==='admin'){
    document.getElementById('appInside').style.display='block';
    document.getElementById('error').style.display='none';
  } else document.getElementById('error').style.display='block';
}
document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

let ytPlayer=null,ytReady=false;
var tag=document.createElement('script');tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  ytPlayer=new YT.Player('yt-player',{height:'1',width:'1',videoId:'eaKxvjmEHgY',playerVars:{'autoplay':0,'controls':0},events:{'onReady':()=>{ytReady=true;}}});
}
function playProtol(){ if(!ytReady||!ytPlayer){alert('Tunggu 3 detik, YouTube lagi loading...');return;} ytPlayer.seekTo(0,true); ytPlayer.playVideo(); }
function stopProtol(){ if(ytPlayer) ytPlayer.pauseVideo(); }

const lamp=document.getElementById('genieLamp');
const smoke=document.getElementById('smoke');
const genie=document.getElementById('genie');
const statusText=document.getElementById('status');
const body=document.getElementById('body');

function toggleLamp(){
  const isOn=lamp.classList.toggle('on');
  body.classList.toggle('lamp-on',isOn);
  smoke.classList.toggle('show',isOn);
  genie.classList.toggle('show',isOn);
  if(isOn){
    statusText.innerHTML='Kendi Nyala Terang Benderang! ✨<br>🧞 Jin Keluar - Kroncong Protol Muter 🎵';
    playProtol();
  } else {
    statusText.innerHTML='Kendi Mati - Redup Kusam<br>👇 Gosok Lampunya Biar Jin Keluar!';
    stopProtol();
  }
}
lamp.addEventListener('click',toggleLamp);
</script>
</body>
</html>
