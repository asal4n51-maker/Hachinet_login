<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HachiNet - Login</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
  
  body {
    background:#080808;
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
    padding: 0 0 20px;
  }

  /* JUDUL */
  .top-title {
    color:white; text-align:center;
    font-size: clamp(26px, 5vw, 44px);
    font-weight:800; line-height:1.05;
    padding: 22px 16px 16px;
  }
  .top-title span { color:#ff2e7e; display:block; font-size:0.55em; letter-spacing:3px; margin-top:6px; }

  /* STAGE UTAMA - INI KUNCINYA */
  .stage {
    width: min(980px, calc(100% - 24px));
    background: radial-gradient(circle at 25% 20%, #331224, #0f0f0f 75%);
    border: 1px solid #222;
    border-radius: 24px;
    overflow:hidden;
    display:grid;
    grid-template-columns: 1fr 1.1fr; /* Laptop: 2 kolom */
    align-items:center;
    transition: background .6s;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
  }
  .stage.on {
    background: radial-gradient(circle at 25% 20%, #ff5da2 0%, #d92a7a 28%, #1a0a14 78%);
  }

  /* ===== LAMPU ===== */
  .lamp-side {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding: 40px 20px; position:relative; min-height: 480px;
  }
  .lamp-wrap { display:flex; flex-direction:column; align-items:center; transform-origin: top center; }
  .lamp-wrap.swing { animation: swing 1.1s ease-in-out; }
  @keyframes swing { 0%{transform:rotate(0)} 20%{transform:rotate(5deg)} 40%{transform:rotate(-4deg)} 60%{transform:rotate(2.5deg)} 80%{transform:rotate(-1.5deg)} 100%{transform:rotate(0)} }
  
  .cord { width:4px; height:110px; background:linear-gradient(#444,#222); }
  .holder { width:34px; height:20px; background:#1e1e1e; border:1px solid #444; border-radius:6px; }
  .bulb {
    width:118px; height:118px; border-radius:50%;
    background:#2b2b2b; border:2px solid #444;
    display:flex; align-items:center; justify-content:center;
    font-size:62px; cursor:pointer; transition:.4s; user-select:none;
  }
  .stage.on .bulb {
    background:#fff6d6; border-color:#ffe27a;
    box-shadow: 0 0 50px 20px rgba(255,220,80,.85), 0 0 120px 50px rgba(255,80,160,.55);
  }
  .glow {
    position:absolute; top:130px; left:50%; transform:translateX(-50%);
    width:320px; height:320px; border-radius:50%;
    background: radial-gradient(circle, rgba(255,100,180,.85), transparent 65%);
    opacity:0; transition:.5s; pointer-events:none;
  }
  .stage.on .glow { opacity:1; }
  .click-text { color:#e8e8e8; background:rgba(0,0,0,.35); padding:8px 14px; border-radius:20px; font-size:13px; margin-top:18px; backdrop-filter: blur(4px); }

  /* ===== LOGIN ===== */
  .login-side { padding: 32px 32px 32px 0; display:flex; justify-content:center; }
  .card {
    width:100%; max-width:390px;
    background: rgba(18,18,18,.92);
    backdrop-filter: blur(10px);
    color:white; padding:26px; border-radius:18px; border:1px solid #2e2e2e;
    box-shadow: 0 15px 40px rgba(0,0,0,.4);
    transition:.5s;
  }
  .stage.on .card { box-shadow: 0 15px 50px rgba(255,0,120,.25); }

  .logo { display:flex; align-items:center; gap:11px; }
  .logo-icon { width:42px; height:42px; background:#ff2e7e; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; }
  .logo b { font-size:21px; }
  .logo small { display:block; color:#888; letter-spacing:2px; font-size:9px; }
  .card h2 { font-size:27px; margin:18px 0 4px; }
  .card .sub { font-size:13px; color:#999; }

  .address-bar {
    display:flex; align-items:center; gap:8px;
    background:#000; border:1px solid #333; border-radius:999px;
    padding:9px 12px; margin-top:16px; font-size:12.5px; color:#ccc; cursor:pointer; overflow:hidden;
  }
  .address-bar .dot { width:8px; height:8px; background:#22c55e; border-radius:50%; flex-shrink:0; }
  .address-bar b { color:white; }
  .address-bar span { color:#ff2e7e; }

  .card label { font-size:12.5px; display:block; margin-top:16px; color:#ddd; }
  .card input {
    width:100%; padding:12px 13px; margin-top:7px;
    background:#222; border:1px solid #333; border-radius:11px; color:white; outline:none; font-size:14.5px;
  }
  .card input:focus { border-color:#ff2e7e; background:#262626; }
  .card button {
    width:100%; padding:13px; margin-top:20px;
    background:#ff2e7e; border:none; border-radius:11px;
    color:white; font-weight:700; cursor:pointer; font-size:15px;
  }
  .card button:active { transform:scale(.98); }
  .row { display:flex; justify-content:space-between; align-items:center; margin-top:13px; font-size:12.5px; color:#aaa; }
  .row a { color:#ff2e7e; text-decoration:none; }
  .divider { text-align:center; margin:16px 0 0; font-size:11.5px; letter-spacing:1px; color:#777; }
  #msg { text-align:center; margin-top:10px; color:#22c55e; font-size:13px; min-height:18px; }

  /* ===== TABLET ===== */
  @media (max-width: 820px) {
    .stage { grid-template-columns: 1fr; }
    .lamp-side { min-height: 300px; padding: 10px 20px 0; }
    .cord { height: 60px; }
    .bulb { width: 96px; height: 96px; font-size: 50px; }
    .glow { top: 70px; width: 260px; height: 260px; }
    .login-side { padding: 10px 18px 22px; }
    .card { max-width: 520px; }
  }

  /* ===== HP KECIL ===== */
  @media (max-width: 480px) {
    body { padding: 0 0 12px; }
    .top-title { padding: 16px 12px 10px; }
    .stage { width: calc(100% - 16px); border-radius: 18px; }
    .lamp-side { min-height: 250px; }
    .lamp-wrap { transform: scale(.9); }
    .login-side { padding: 4px 12px 16px; }
    .card { padding: 20px 18px; border-radius: 15px; }
    .card h2 { font-size: 24px; }
    .click-text { font-size: 12px; }
  }
</style>
</head>
<body>

<div class="top-title">JavaScript Animation<span>• HACHINET</span></div>

<div class="stage" id="stage">
  <!-- KIRI / ATAS : LAMPU -->
  <div class="lamp-side">
    <div class="glow"></div>
    <div class="lamp-wrap" id="lampWrap">
      <div class="cord"></div>
      <div class="holder"></div>
      <div class="bulb" id="bulb">💡</div>
    </div>
    <div class="click-text">💡 Klik lampu untuk nyala / mati</div>
  </div>

  <!-- KANAN / BAWAH : LOGIN -->
  <div class="login-side">
    <div class="card">
      <div class="logo">
        <div class="logo-icon">🐝</div>
        <div><b>HachiNet</b><small>YOUR SPACE • LOGIN</small></div>
      </div>
      <h2>Welcome Back 👋</h2>
      <p class="sub">Masuk ke aplikasi HachiNet untuk lanjut</p>

      <div class="address-bar" id="copyAddr">
        <div class="dot"></div>
        <span>🔒</span>
        <div><b>hachinet.app</b><span>/login</span></div>
        <div style="margin-left:auto; color:#888;">⧉ Copy</div>
      </div>

      <form id="loginForm">
        <label>Email / Username HachiNet</label>
        <input type="text" id="email" placeholder="contoh: kamu@hachinet.app" required>
        <label>Password</label>
        <input type="password" id="password" placeholder="Enter password" required>
        <div class="row">
          <label style="margin:0; display:flex; gap:6px; align-items:center;"><input type="checkbox" style="width:auto; margin:0;"> Ingat saya</label>
          <a href="#">Lupa password?</a>
        </div>
        <button type="submit">Masuk ke HachiNet →</button>
      </form>

      <div class="divider">BELUM PUNYA AKUN? <a href="#" style="color:#ff2e7e; text-decoration:none; font-weight:600;">DAFTAR HACHINET</a></div>
      <p id="msg"></p>
    </div>
  </div>
</div>

<script>
  const stage = document.getElementById('stage');
  const bulb = document.getElementById('bulb');
  const lampWrap = document.getElementById('lampWrap');
  let audioCtx = null;

  // Biar di HP langsung nyala, di laptop tetap bisa klik
  if (window.innerWidth < 820) stage.classList.add('on');

  bulb.addEventListener('click', () => {
    const turningOn = !stage.classList.contains('on');
    stage.classList.toggle('on');
    lampWrap.classList.remove('swing');
    void lampWrap.offsetWidth;
    lampWrap.classList.add('swing');
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    if (turningOn) {
      const hum = audioCtx.createOscillator();
      const humGain = audioCtx.createGain();
      hum.type = "sine";
      hum.frequency.setValueAtTime(120, now + 0.05);
      humGain.gain.setValueAtTime(0.001, now);
      humGain.gain.linearRampToValueAtTime(0.06, now + 0.08);
      humGain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      hum.connect(humGain); humGain.connect(audioCtx.destination);
      hum.start(now + 0.05); hum.stop(now + 0.38);
    }
  });

  document.getElementById('copyAddr').addEventListener('click', () => {
    navigator.clipboard.writeText('https://hachinet.app/login');
    document.getElementById('msg').textContent = 'Alamat HachiNet tersalin ✓';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    document.getElementById('msg').textContent = `Login berhasil sebagai ${email} — Mengalihkan...`;
  });
</script>

</body>
</html>
