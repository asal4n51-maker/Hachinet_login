<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hachinet Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f0f0f;color:#fff;min-height:100vh;display:flex;justify-content:center;align-items:center}
.card{background:#1a1a1a;padding:30px;border-radius:20px;width:90%;max-width:350px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
h1{margin-bottom:20px;font-size:22px}
input{width:100%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #333;background:#222;color:#fff;outline:none}
button{width:100%;padding:12px;background:#ff2e7e;color:#fff;border:0;border-radius:10px;font-size:16px;margin-top:10px;cursor:pointer}
#app{display:none;text-align:center}
#bulb{font-size:100px;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:.2s}
#bulb.on{filter:drop-shadow(0 0 30px yellow)}
#status{margin-top:10px;color:#aaa}
#error{color:#ff5555;font-size:13px;margin-top:8px;display:none}
</style>
</head>
<body>

<!-- HALAMAN LOGIN -->
<div class="card" id="loginPage">
  <h1>🔐 HACHINET LOGIN</h1>
  <input type="text" id="username" placeholder="Username" autocomplete="off">
  <input type="password" id="password" placeholder="Password">
  <button onclick="doLogin()">MASUK</button>
  <div id="error">Username / Password salah!</div>
  <p style="font-size:12px;color:#777;margin-top:15px">User: admin | Pass: admin</p>
</div>

<!-- HALAMAN APLIKASI -->
<div id="app">
  <div id="bulb">💡</div>
  <div id="status">Lampu Mati - Klik Lampu</div>
  <br>
  <button onclick="logout()" style="width:auto;padding:8px 20px;background:#333">Logout</button>
</div>

<div id="yt-player" style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;"></div>

<script>
// === LOGIN ADMIN / ADMIN ===
function doLogin(){
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  if(u === 'admin' && p === 'admin'){
    document.getElementById('loginPage').style.display = 'none';
    document.getElementById('app').style.display = 'block';
  } else {
    document.getElementById('error').style.display = 'block';
  }
}
function logout(){
  document.getElementById('app').style.display = 'none';
  document.getElementById('loginPage').style.display = 'block';
  stopProtol();
  document.getElementById('bulb').classList.remove('on');
  document.getElementById('status').innerText = 'Lampu Mati - Klik Lampu';
}
// Enter juga bisa login
document.getElementById('password').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });

// === YOUTUBE - KRONCONG PROTOL ===
let ytPlayer = null;
let ytReady = false;
var tag = document.createElement('script');
tag.src = "https://www.youtube.com/iframe_api";
document.head.appendChild(tag);
function onYouTubeIframeAPIReady(){
  ytPlayer = new YT.Player('yt-player', {
    height:'1', width:'1',
    videoId:'eaKxvjmEHgY',
    playerVars:{'autoplay':0,'controls':0},
    events:{'onReady':()=>{ ytReady=true; }}
  });
}
function playProtol(){
  if(!ytReady || !ytPlayer) { alert('Tunggu 3 detik, YouTube lagi loading...'); return; }
  ytPlayer.seekTo(0, true);
  ytPlayer.playVideo();
}
function stopProtol(){ if(ytPlayer) ytPlayer.pauseVideo(); }

// === LAMPU ===
const bulb = document.getElementById('bulb');
const statusText = document.getElementById('status');
function toggleLamp(){
  const isOn = bulb.classList.toggle('on');
  if(isOn){
    statusText.innerText = 'Lampu Nyala - Kroncong Protol 🎵';
    playProtol();
  } else {
    statusText.innerText = 'Lampu Mati - Klik Lampu';
    stopProtol();
  }
}
bulb.addEventListener('click', toggleLamp);
bulb.addEventListener('touchstart', function(e){ e.preventDefault(); toggleLamp(); }, {passive:false});
</script>
</body>
</html>
