<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HachiNet - Login</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#080808;min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:0 20px}
.top-title{color:white;text-align:center;font-size:clamp(28px,5vw,44px);font-weight:800;line-height:1.05;padding:22px 16px 16px}
.top-title span{color:#ff2e7e;display:block;font-size:.55em;letter-spacing:3px;margin-top:6px}
.stage{min-width:980px;width:980px;max-width:calc(100% - 24px);background:radial-gradient(circle at 25% 20%,#331224,#0f0f0f 75%);border:1px solid #222;border-radius:24px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;align-items:center;transition:.6s}
.stage.on{background:radial-gradient(circle at 25% 20%,#ff5da2 0%,#d92a7a 28%,#1a0a14 78%)}
.lamp-side{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;position:relative;min-height:480px}
.lamp-wrap{display:flex;flex-direction:column;align-items:center;transform-origin:top center}
.lamp-wrap.swing{animation:swing 1.1s ease-in-out}
@keyframes swing{0%{transform:rotate(0)}20%{transform:rotate(5deg)}40%{transform:rotate(-4deg)}60%{transform:rotate(2.5deg)}80%{transform:rotate(-1.5deg)}100%{transform:rotate(0)}}
.cord{width:4px;height:110px;background:#222}.holder{width:34px;height:20px;background:#1e1e1e;border:1px solid #444;border-radius:6px}
.bulb{width:140px;height:140px;border-radius:50%;background:#2b2b2b;border:2px solid #444;display:flex;align-items:center;justify-content:center;font-size:70px;cursor:pointer;position:relative;z-index:10;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent}
.stage.on .bulb{background:#fff6d6;border-color:#ffe27a;box-shadow:0 0 50px 20px rgba(255,220,80,.85)}
.hint{color:#fff;margin-top:18px;font-size:13px;opacity:.8}
.form-side{padding:36px 36px 36px 0}.form-card{background:#fff;border-radius:18px;padding:26px}
input{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;margin-bottom:10px}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#ff2e7e;color:#fff;font-weight:700;cursor:pointer}
#msg{margin-top:10px;font-size:13px;color:#0a7a42;min-height:18px}
@media(max-width:820px){.stage{min-width:0;width:100%;grid-template-columns:1fr}.form-side{padding:0 16px 20px}.lamp-side{min-height:380px}}
</style>
</head>
<body>
<div class="top-title">HachiNet<span>LOGIN PAGE</span></div>
<div class="stage" id="stage">
  <div class="lamp-side">
    <div class="lamp-wrap" id="lampWrap"><div class="cord"></div><div class="holder"></div><div class="bulb" id="bulb">💡</div></div>
    <div class="hint">Klik lampu untuk nyala / mati</div>
  </div>
  <div class="form-side"><div class="form-card">
    <h2>Selamat Datang</h2><p>Login untuk lanjut ke HachiNet.</p>
    <form id="loginForm">
      <input id="email" type="email" placeholder="Email" required>
      <input type="password" placeholder="Password" required>
      <button class="btn" type="submit">Login</button>
    </form><div id="msg"></div>
  </div></div>
</div>
<script>
  const stage=document.getElementById('stage'), bulb=document.getElementById('bulb'), lampWrap=document.getElementById('lampWrap');
  let audioCtx=null;
  function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); }
  function playClick(){ initAudio(); const n=audioCtx.currentTime,o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type="square"; o.frequency.setValueAtTime(1800,n); o.frequency.exponentialRampToValueAtTime(200,n+0.08); g.gain.setValueAtTime(0.15,n); g.gain.exponentialRampToValueAtTime(0.001,n+0.1); o.connect(g); g.connect(audioCtx.destination); o.start(n); o.stop(n+0.1); }
  function suling(f,t,d,slide=null){
    const o=audioCtx.createOscillator(), g=audioCtx.createGain(), vib=audioCtx.createOscillator(), vibG=audioCtx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(f*0.98,t); o.frequency.linearRampToValueAtTime(f,t+0.08);
    if(slide) o.frequency.exponentialRampToValueAtTime(slide,t+d*0.8);
    vib.frequency.value=4.8; vibG.gain.value=f*0.012; vib.connect(vibG); vibG.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.5,t+0.15); g.gain.setValueAtTime(0.5,t+d*0.65); g.gain.exponentialRampToValueAtTime(0.001,t+d);
    o.connect(g); g.connect(audioCtx.destination); o.start(t); vib.start(t); o.stop(t+d+0.05); vib.stop(t+d+0.05);
  }
  function playSunda(){
    initAudio(); const t0=audioCtx.currentTime+0.4;
    const lagu=[[587,0.9,null],[659,0.7,698],[698,1.1,null],[784,0.8,880],[880,1.2,null],[784,0.7,null],[698,0.7,659],[659,1.0,null],[587,0.8,null],[523,1.2,587],[587,0.9,null],[659,0.7,null],[698,1.0,784],[880,1.4,784],[698,0.9,null],[587,1.6,null]];
    let t=t0; lagu.forEach(([f,d,s])=>{ suling(f,t,d,s); t+=d-0.08; });
  }
  function toggleLamp(){
    const on=!stage.classList.contains('on');
    stage.classList.toggle('on');
    lampWrap.classList.remove('swing'); void lampWrap.offsetWidth; lampWrap.classList.add('swing');
    playClick(); if(on) setTimeout(playSunda,100);
  }
  bulb.addEventListener('click', toggleLamp);
  bulb.addEventListener('touchstart', (e)=>{ e.preventDefault(); toggleLamp(); }, {passive:false});

  document.getElementById('loginForm').addEventListener('submit',(e)=>{
    e.preventDefault();
    const email=document.getElementById('email').value;
    document.getElementById('msg').textContent=`Login berhasil sebagai ${email} — Mengalihkan...`;
    setTimeout(()=>{ window.location.href='dashboard.html'; }, 800);
  });
</script>
</body>
</html>
