<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HachiNet - Login</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', system-ui, sans-serif; }
  body { background:#080808; min-height:100dvh; display:flex; flex-direction:column; align-items:center; padding:0 20px; }
  .top-title { color:white; text-align:center; font-size:clamp(28px, 5vw, 44px); font-weight:800; line-height:1.05; padding:22px 16px 16px; }
  .top-title span { color:#ff2e7e; display:block; font-size:0.55em; letter-spacing:3px; margin-top:6px; }
  .stage { min-width:980px; width:980px; max-width:calc(100% - 24px); background:radial-gradient(circle at 25% 20%, #331224, #0f0f0f 75%); border:1px solid #222; border-radius:24px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; align-items:center; transition:.6s; box-shadow:0 20px 60px rgba(0,0,0,.5); }
  .stage.on { background:radial-gradient(circle at 25% 20%, #ff5da2 0%, #d92a7a 28%, #1a0a14 78%); }
  .lamp-side { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; position:relative; min-height:480px; }
  .lamp-wrap { display:flex; flex-direction:column; align-items:center; transform-origin:top center; }
  .lamp-wrap.swing { animation:swing 1.1s ease-in-out; }
  @keyframes swing { 0%{transform:rotate(0)} 20%{transform:rotate(5deg)} 40%{transform:rotate(-4deg)} 60%{transform:rotate(2.5deg)} 80%{transform:rotate(-1.5deg)} 100%{transform:rotate(0)} }
  .cord { width:4px; height:110px; background:linear-gradient(#444,#222); }
  .holder { width:34px; height:20px; background:#1e1e1e; border:1px solid #444; border-radius:6px; }
  .bulb { width:118px; height:118px; border-radius:50%; background:#2b2b2b; border:2px solid #444; display:flex; align-items:center; justify-content:center; font-size:62px; cursor:pointer; transition:.4s; user-select:none; }
  .stage.on .bulb { background:#fff6d6; border-color:#ffe27a; box-shadow:0 0 50px 20px rgba(255,220,80,.85), 0 0 120px 50px rgba(255,180,60,.55); }
  .glow { position:absolute; top:130px; left:50%; transform:translateX(-50%); width:320px; height:320px; border-radius:50%; background:radial-gradient(circle, rgba(255,100,180,.85), transparent 65%); opacity:0; transition:.5s; pointer-events:none; }
  .stage.on .glow { opacity:1; }
  .hint { color:#fff; margin-top:18px; font-size:13px; opacity:.8; }
  .form-side { padding:36px 36px 36px 0; }
  .form-card { background:#fff; border-radius:18px; padding:26px; }
  .form-card h2 { font-size:22px; margin-bottom:6px; }
  .form-card p { font-size:13px; color:#666; margin-bottom:16px; }
  input { width:100%; padding:12px; border:1px solid #ddd; border-radius:10px; margin-bottom:10px; font-size:14px; }
  .btn { width:100%; padding:12px; border:0; border-radius:10px; background:#ff2e7e; color:#fff; font-weight:700; cursor:pointer; }
  .addr { margin-top:12px; background:#f5f5f5; padding:10px; border-radius:10px; font-size:12px; display:flex; justify-content:space-between; align-items:center; gap:8px; }
  #msg { margin-top:10px; font-size:13px; color:#0a7a42; min-height:18px; }
  @media (max-width:820px) { .stage { min-width:0; width:100%; grid-template-columns:1fr; } .form-side { padding:0 16px 20px; } .lamp-side { min-height:380px; } }
</style>
</head>
<body>
  <div class="top-title">HachiNet<span>LOGIN PAGE</span></div>
  <div class="stage" id="stage">
    <div class="lamp-side">
      <div class="glow"></div>
      <div class="lamp-wrap" id="lampWrap">
        <div class="cord"></div><div class="holder"></div>
        <div class="bulb" id="bulb">💡</div>
      </div>
      <div class="hint">Klik lampu untuk nyala / mati</div>
    </div>
    <div class="form-side">
      <div class="form-card">
        <h2>Selamat Datang</h2><p>Login untuk lanjut ke HachiNet.</p>
        <form id="loginForm">
          <input id="email" type="email" placeholder="Email" required>
          <input type="password" placeholder="Password" required>
          <button class="btn" type="submit">Login</button>
        </form>
        <div class="addr"><span>https://hachinet.app/login</span><button id="copyAddr">Salin</button></div>
        <div id="msg"></div>
      </div>
    </div>
  </div>
<script>
  const stage = document.getElementById('stage');
  const bulb = document.getElementById('bulb');
  const lampWrap = document.getElementById('lampWrap');
  let audioCtx = null;
  if (window.innerWidth < 820) stage.classList.add('on');
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }
  function playClick() {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(1800, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }
  function suling(f,t,d,slide=null){
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  const vib = audioCtx.createOscillator();
  const vibG = audioCtx.createGain();
  // pakai sine biar lembut kaya bambu asli
  o.type = "sine";
  o.frequency.setValueAtTime(f*0.98, t);
  o.frequency.linearRampToValueAtTime(f, t+0.08);
  if(slide) o.frequency.exponentialRampToValueAtTime(slide, t+d*0.8);
  // vibrato pelan, ciri khas suling Sunda
  vib.frequency.value = 4.8;
  vibG.gain.value = f*0.012;
  vib.connect(vibG); vibG.connect(o.frequency);
  // naikin pelan, turun pelan biar gak putus-putus
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(0.5, t+0.15);
  g.gain.setValueAtTime(0.5, t+d*0.65);
  g.gain.exponentialRampToValueAtTime(0.001, t+d);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); vib.start(t);
  o.stop(t+d+0.05); vib.stop(t+d+0.05);
}
function playSunda(){
  initAudio();
  const t0 = audioCtx.currentTime + 0.4;
  // lagu: Manuk Dadali versi pelog, nadanya panjang & melayang
  // [nada, durasi, slide-ke-nada-berikutnya]
  const lagu = [
    [587, 0.9, null],
    [659, 0.7, 698],
    [698, 1.1, null],
    [784, 0.8, 880],
    [880, 1.2, null],
    [784, 0.7, null],
    [698, 0.7, 659],
    [659, 1.0, null],
    [587, 0.8, null],
    [523, 1.2, 587],
    [587, 0.9, null],
    [659, 0.7, null],
    [698, 1.0, 784],
    [880, 1.4, 784],
    [698, 0.9, null],
    [587, 1.6, null],
  ];
  let t = t0;
  lagu.forEach(([f,d,s])=>{
    suling(f, t, d, s);
    t += d - 0.08; // sengaja dibikin nyambung, gak putus
  });
  bulb.addEventListener('click', () => {
    const turningOn = !stage.classList.contains('on');
    stage.classList.toggle('on');
    lampWrap.classList.remove('swing'); void lampWrap.offsetWidth; lampWrap.classList.add('swing');
    playClick();
    if (turningOn) setTimeout(playSunda, 100);
  });
  document.getElementById('copyAddr').addEventListener('click', () => {
    navigator.clipboard.writeText('https://hachinet.app/login');
    document.getElementById('msg').textContent = 'Alamat HachiNet tersalin ✓';
  });
  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    document.getElementById('msg').textContent = `Login berhasil sebagai ${email} — Mengalihkan...`;
  });
</script>
</body>
</html>
