<script>
  const stage = document.getElementById('stage');
  const bulb = document.getElementById('bulb');
  const lampWrap = document.getElementById('lampWrap');
  let audioCtx = null;

  if (window.innerWidth < 820) stage.classList.add('on');

  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  function playClick() {
    initAudio();
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(1800, now);
    osc.frequency.exponentialRampToValueAtTime(200, now + 0.08);
    gain.gain.setValueAtTime(0.15, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 0.1);
  }

  // ===== SULING SUNDA =====
  // freq = nada, time = mulai, dur = panjang, slideTo = buat cengkok melorot
  function suling(freq, time, dur, slideTo = null) {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    const vibrato = audioCtx.createOscillator();
    const vibratoGain = audioCtx.createGain();

    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, time);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, time + dur * 0.7);

    // Vibrato biar kayak ditiup manusia
    vibrato.frequency.value = 5.5;
    vibratoGain.gain.value = freq * 0.008;
    vibrato.connect(vibratoGain); vibratoGain.connect(osc.frequency);

    // Nafas suling: pelan masuk, sustain, pelan habis
    gain.gain.setValueAtTime(0.0001, time);
    gain.gain.linearRampToValueAtTime(0.28, time + 0.08);
    gain.gain.setValueAtTime(0.28, time + dur * 0.7);
    gain.gain.exponentialRampToValueAtTime(0.001, time + dur);

    // Tambah desis nafas biar gak kering
    const noise = audioCtx.createBufferSource();
    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * dur, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * 0.08;
    noise.buffer = buffer;
    const noiseFilter = audioCtx.createBiquadFilter();
    noiseFilter.type = "bandpass"; noiseFilter.frequency.value = freq * 2; noiseFilter.Q.value = 1;
    const noiseGain = audioCtx.createGain(); noiseGain.gain.value = 0.15;
    noise.connect(noiseFilter); noiseFilter.connect(noiseGain); noiseGain.connect(gain);

    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(time); vibrato.start(time); noise.start(time);
    osc.stop(time + dur); vibrato.stop(time + dur); noise.stop(time + dur);
  }

  // Bonang degung buat iringan
  function bonang(freq, time, vol = 0.12) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, time);
    g.gain.linearRampToValueAtTime(vol, time + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, time + 0.6);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(time); o.stop(time + 0.6);
  }

  function playSunda() {
    initAudio();
    const t0 = audioCtx.currentTime + 0.1;
    // Laras Pelog Degung Sunda: 1 2 3 4 5
    // Do = 523, Re = 587, Mi = 622, Sol = 784, La = 880
    // Melodi mirip Manuk Dadali: 5 3 2 1 - 2 3 5 3 - 2 1
    const melodi = [
      [880, 0.35, null], [622, 0.35, null], [587, 0.35, null], [523, 0.6, 587],
      [587, 0.3, null], [622, 0.3, null], [880, 0.5, 784],
      [622, 0.35, null], [587, 0.35, null], [523, 0.9, null],
      [784, 0.4, 880], [880, 0.6, 784], [622, 0.8, null],
    ];
    let t = t0;
    melodi.forEach(([f, d, slide]) => {
      suling(f, t, d + 0.05, slide);
      bonang(261, t, 0.06); // degung bass
      t += d;
    });
  }

  bulb.addEventListener('click', () => {
    const turningOn = !stage.classList.contains('on');
    stage.classList.toggle('on');
    lampWrap.classList.remove('swing'); void lampWrap.offsetWidth; lampWrap.classList.add('swing');
    playClick();
    if (turningOn) setTimeout(playSunda, 100);
  });

  document.getElementById('copyAddr').addEventListener('click', () => {
    navigator.clipboard.writeText('https://hachinet.app/login');
    document.getElementById('msg').textContent = 'Alamat HachiNet tersalin ✓';
  });

  document.getElementById('loginForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    document.getElementById('msg').textContent = `Login berhasil sebagai ${email} — Mengalihkan...`;
  });
</script>
